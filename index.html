<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Clutch</title>
<style>
  :root{
    --green:#C6FF1E;
    --purple:#5B21B6;
    --dark:#1A1625;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--dark);
    color:var(--white);
    font-family:'Helvetica Neue', Arial, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:420px;
    width:100%;
    background:linear-gradient(180deg, var(--purple) 0%, #3d1780 100%);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .top{
    background:var(--green);
    padding:40px 32px 32px;
    text-align:center;
  }
  .logo{
    font-size:64px;
    font-weight:900;
    color:var(--purple);
    letter-spacing:-2px;
    line-height:1;
  }
  .brand{
    font-size:22px;
    font-weight:800;
    color:var(--dark);
    letter-spacing:4px;
    margin-top:8px;
  }
  .tagline{
    font-size:13px;
    color:var(--purple);
    margin-top:6px;
    letter-spacing:1px;
  }
  .bottom{
    padding:36px 28px;
    text-align:center;
  }
  .thanks{
    font-size:15px;
    color:#D8CCF5;
    margin-bottom:24px;
    line-height:1.6;
  }
  .code-label{
    font-size:12px;
    letter-spacing:2px;
    color:var(--green);
    margin-bottom:8px;
    text-transform:uppercase;
  }
  .code-box{
    background:rgba(255,255,255,0.08);
    border:2px dashed var(--green);
    border-radius:14px;
    padding:18px;
    margin-bottom:28px;
  }
  .code{
    font-size:32px;
    font-weight:900;
    letter-spacing:6px;
    color:var(--white);
  }
  .expiry{
    font-size:11px;
    color:#B9A8E0;
    margin-top:6px;
  }
  .cta{
    display:block;
    width:100%;
    padding:16px;
    border-radius:14px;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    margin-bottom:12px;
    transition:transform 0.15s ease;
  }
  .cta:active{transform:scale(0.97);}
  .cta.primary{
    background:var(--green);
    color:var(--dark);
  }
  .cta.secondary{
    background:transparent;
    color:var(--white);
    border:1.5px solid rgba(255,255,255,0.3);
  }
  .footer{
    margin-top:20px;
    font-size:12px;
    color:#B9A8E0;
    letter-spacing:1px;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="top">
      <div class="logo">C</div>
      <div class="brand">CLUTCH</div>
      <div class="tagline">WE'RE HERE FOR THE JOURNEY</div>
    </div>

    <div class="bottom">
      <p class="thanks">
        Thanks for choosing Clutch.<br>
        Here's something for your next order.
      </p>

      <div class="code-label">Your discount code</div>
      <div class="code-box">
        <div class="code">CLUTCH10</div>
        <div class="expiry">10% off &middot; Valid until 30 Sep 2026</div>
      </div>

      <a href="https://wa.me/201508080555" class="cta primary" target="_blank">Order on WhatsApp</a>
      <a href="https://instagram.com/clutch_s10" class="cta secondary" target="_blank">Follow us on Instagram</a>

      <div class="footer">Stay Clutched.</div>
    </div>
  </div>

</body>
</html>
